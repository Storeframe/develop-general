# Any <project>.test (and its subdomains) serves the Magento install in /var/www/<project>,
# falling back to /var/www/default when that folder does not exist.
server {
    listen 80;
    listen [::]:80;

    server_name ~^(?<subdomain>.+\.)?(?<domain>\w+)\.test$;

    set $MAGE_ROOT /var/www/$domain;
    if (!-d $MAGE_ROOT) {
        set $MAGE_ROOT /var/www/default;
    }
    set $MAGE_RUN_CODE default;
    set $MAGE_RUN_TYPE store;

    include /usr/local/openresty/nginx/conf/sites-available/captcha.conf;
    include /usr/local/openresty/nginx/conf/sites-available/magento.nginx.conf;
}
